<nav class="cell large-3 demo-index" id="contents" aria-label="Contents">
    <div class="card">
        <details class="card-section pt-5" open data-collapse="small">
            <summary>Contents</summary>
            <div class="demo-index-groups">
                @@toc
            </div>
        </details>
        <!-- Demo settings, in reach while scrolling: color mode (a copy of the avatar menu's, kept in sync in _demo.html), the Space theme, the brand color and the demo-only reduced motion. -->
        <div class="card-section demo-index-settings">
            <fieldset class="radio-tabs radio-tabs-icons stretch small hollow" data-color-mode aria-label="Color theme">
                <label for="demo-mode-light" class="radio-tabs-option" aria-label="Light">
                    <i class="fa-solid fa-sun"></i>
                    <input id="demo-mode-light" type="radio" name="demo_color_mode" value="light">
                    <span>Light</span>
                </label>
                <label for="demo-mode-dark" class="radio-tabs-option" aria-label="Dark">
                    <i class="fa-solid fa-moon"></i>
                    <input id="demo-mode-dark" type="radio" name="demo_color_mode" value="dark">
                    <span>Dark</span>
                </label>
                <label for="demo-mode-auto" class="radio-tabs-option" aria-label="System">
                    <i class="fa-solid fa-desktop"></i>
                    <input id="demo-mode-auto" type="radio" name="demo_color_mode" value="auto">
                    <span>System</span>
                </label>
            </fieldset>
            <div class="demo-index-rows">
                <label class="label-wrapper" for="themingSwitch">
                    <span class="switch tiny brand">
                        <input class="switch-input" role="switch" id="themingSwitch" type="checkbox" checked>
                        <span class="switch-paddle" aria-hidden="true"></span>
                    </span>
                    <span>Space theme</span>
                </label>
                <input type="color" id="theme-color" value="#975938" aria-label="Theme color">
                <output class="demo-hex" for="theme-color">#975938</output>

                <span class="demo-index-brand">
                    <label for="brand-color">Brand</label>
                    <button type="button" class="button clear tiny" id="brand-color-reset" hidden>Reset</button>
                </span>
                <input type="color" id="brand-color" value="#db3b01">
                <output class="demo-hex" for="brand-color">#db3b01</output>

                <label class="label-wrapper" for="demo-reduce-motion">
                    <span class="switch tiny">
                        <input class="switch-input" role="switch" id="demo-reduce-motion" type="checkbox" data-reduce-motion>
                        <span class="switch-paddle" aria-hidden="true"></span>
                    </span>
                    <span>Reduce motion</span>
                </label>
            </div>
        </div>
    </div>
</nav>
