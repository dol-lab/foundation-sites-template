<section class="cell demo-section" id="modal">
    <div class="card static overflow-initial">
        <div class="card-section">
            <h2>Modal</h2>
            <p class="demo-intro">Foundation's reveal: <code>.reveal</code> with <code>data-reveal</code>, opened by any element with <code>data-open="&lt;id&gt;"</code>, closed by <code>data-close</code>.</p>
            <!-- example -->
            <button class="button" type="button" data-open="demo-modal">Open modal</button>
            <div class="reveal" id="demo-modal" data-reveal>
                <h2>Modal title</h2>
                <p class="lead">A short lead.</p>
                <p>The content of the modal.</p>
                <button class="close-button" data-close aria-label="Close" type="button">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!-- /example -->
        </div>
    </div>
</section>
