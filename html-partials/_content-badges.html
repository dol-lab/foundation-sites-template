<section class="cell demo-section" id="badges">
    <div class="card static overflow-initial">
        <div class="card-section">
            <h2>Badges and labels</h2>
            <p class="demo-intro">A <code>.badge</code> is a round counter, a <code>.label</code> a short tag (Spaces: a member's status, a post's editor notes with an icon). Both take a palette color.</p>
            <h3>Badges</h3>
            <!-- example -->
            <div class="demo-row">
                <span class="badge"><i class="fa fa-heart"></i></span>
                <span class="badge primary">1</span>
                <span class="badge secondary">2</span>
                <span class="badge success">3</span>
                <span class="badge warning">B</span>
                <span class="badge alert">A</span>
            </div>
            <!-- /example -->

            <h3>Labels</h3>
            <!-- example -->
            <div class="demo-row">
                <span class="label">Default</span>
                <span class="label primary">Primary</span>
                <span class="label secondary">Secondary</span>
                <span class="label success">Success</span>
                <span class="label warning">Warning</span>
                <span class="label alert">Alert</span>
                <span class="label warning"><i class="fas fa-sticky-note"></i> 2</span>
            </div>
            <!-- /example -->

        </div>
    </div>
</section>
