<!-- Styles and scripts of this page only, prefixed demo- (ds- is defaultspace's); nothing here ships in css/ or js/. Nothing page-only goes into scss/: the page uses library classes, so a missing style is a gap in the library. -->
<style>
    /* Breakpoints of this library: medium 30em, large 45em, xlarge 60em, xxlarge 75em. */
    html {
        scroll-behavior: smooth;
        scroll-padding-top: 1rem;
    }

    .demo-section {
        & > .card > .card-section {
            padding: 1.25rem;

            @media (min-width: 30em) {
                padding: 2rem;
            }
        }

        & h2 {
            margin-bottom: 0.25rem;
        }

        /* The section's own headings, not those of an example. */
        & .card-section > :is(h3, h4) {
            margin-top: 1.5rem;
        }
    }

    .demo-intro {
        color: var(--f-color-text-2);
        max-width: 42rem;
    }

    /* Inline code is a name: keep it on one line, unless a long path in the docs' prose would overflow a phone. */
    :not(pre) > code {
        white-space: nowrap;
    }

    @media (max-width: 44.9375em) {
        .demo-doc :is(p, li) > code {
            white-space: normal;
            overflow-wrap: anywhere;
        }
    }

    /* Small uppercase label: the index's groups and the page controls. */
    .demo-label {
        margin: 0;
        color: var(--f-color-text-0);
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* Table of contents: stacked above the content below large, folded there (data-collapse) with
       its groups side by side; from large a sticky rail whose active link follows the scroll. */
    .demo-index {
        & summary {
            font-weight: 500;
            cursor: pointer;
        }

        & .demo-index-groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
            gap: 1.25rem 1rem;
            margin-top: 0.75rem;
        }

        & h2 {
            margin-bottom: 0.375rem;
            /* In line with the links' text: their padding plus the current-item border. */
            padding-left: calc(0.75rem + 2px);
        }

        /* Demo settings, reachable wherever the page is scrolled. */
        & .demo-index-settings {
            border-top: 1px solid var(--f-color-border-0);

            & fieldset {
                margin: 0;
            }
        }

        & .demo-index-theme {
            display: flex;
            align-items: center;
            gap: 0.5rem;

            & .label-wrapper {
                margin: 0 auto 0 0;
            }
        }

        & .menu {
            box-shadow: inset 1px 0 var(--f-color-border-0);

            & a {
                padding: 0.3rem 0.75rem;
                border-left: 2px solid transparent;
                border-radius: 0 var(--f-radius-small) var(--f-radius-small) 0;
                color: var(--f-color-text-1);

                &:hover {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-border-2);
                }

                &[aria-current] {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-brand);
                    background: var(--f-color-bg-2);
                }
            }
        }

        /* The header scrolls away, so the index sticks at the grid's own gutter. */
        @media (min-width: 45em) {
            position: sticky;
            top: 1rem;
            align-self: flex-start;

            /* The list scrolls, the color mode below it stays in view. */
            & .card {
                max-height: calc(100vh - 2rem);
            }

            & details {
                --f-focus-offset: var(--f-focus-inset);

                flex: 0 1 auto;
                min-height: 0;
                overflow-y: auto;
            }

            /* No summary to reopen it here, so the list shows even if it was closed on a phone. */
            & summary {
                display: none;
            }

            & details::details-content {
                content-visibility: visible;
            }

            & .demo-index-groups {
                grid-template-columns: 1fr;
                margin-top: 0;
            }
        }
    }

    /* An example on a dotted stage, its code folded under it in the same frame. */
    .demo-example {
        margin: 1rem 0 1.5rem;
        border: 1px solid var(--f-color-border-1);
        border-radius: var(--f-radius);
        overflow: clip;
        overflow-clip-margin: calc(var(--f-focus-offset) + var(--f-focus-width)); /* the focus ring of a full-width child */
    }

    .demo-preview {
        padding: 1.5rem 1.25rem;
        background: radial-gradient(color-mix(in oklch, var(--f-color-border-0) 60%, transparent) 1px, transparent 1px) 0 0 / 1rem 1rem, light-dark(var(--f-color-bg-2), color-mix(in oklch, var(--f-color-bg-1), var(--f-color-bg-0)));

        & > :last-child {
            margin-bottom: 0;
        }
    }

    /* Lays out a row of inline components without their own margins. */
    .demo-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.5rem;
        margin-bottom: 0.5rem;

        & > * {
            margin: 0;
        }
    }

    .demo-markup {
        position: relative;
        border-top: 1px solid var(--f-color-border-0);
        background: var(--f-color-bg-0);

        & > summary {
            display: flex;
            gap: 0.5em;
            align-items: center;
            justify-content: flex-end;
            padding: 0.25rem 0.75rem;
            color: var(--f-color-text-2);
            font-size: 0.75rem;
            cursor: pointer;
            list-style: none;

            &::-webkit-details-marker {
                display: none;
            }

            &::before {
                content: "</>";
                font-family: monospace;
            }

            &:hover {
                color: var(--f-color-text-0);
            }
        }

        &[open] > summary {
            border-bottom: 1px solid var(--f-color-border-0);
        }

        & .code-block {
            max-height: 24rem;
            margin: 0;
            padding: 1rem 1.25rem;
            border: 0;
            border-radius: 0;
            background: transparent;
            font-size: 0.8125rem;
        }

        & .demo-copy {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            margin: 0;
        }
    }

    /* The global inline-code pill would frame every line of a code block. */
    .code-block > code {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 1em;
    }

    /* Page controls atop #start: one toolbar, a label row (with the control's toggle or reset) over a swatch row. */
    .demo-controls-card > .demo-controls {
        display: grid;
        grid-template-columns: repeat(2, auto);
        justify-content: start;
        gap: 1.25rem 2rem;
        padding: 1.25rem;

        @media (min-width: 30em) {
            padding: 1.25rem 2rem;
        }

    }

    .demo-controls {
        & .demo-control {
            display: grid;
            grid-template-rows: 1.25rem 2rem;
            gap: 0.5rem;

            & > * {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin: 0;
            }

            /* A hairline between the groups where they sit in one row. */
            @media (min-width: 60em) {
                & + .demo-control {
                    padding-left: 2rem;
                    box-shadow: inset 1px 0 var(--f-color-border-0);
                }
            }
        }

        & .demo-control-image {
            grid-column: 1 / -1;

            @media (min-width: 60em) {
                grid-column: auto;
            }
        }

        & .demo-thumb {
            width: 3rem;
            height: 2rem;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border-radius: var(--f-radius-small);
            background: var(--f-color-bg-2);
            box-shadow: inset 0 0 0 1px var(--f-color-border-1);
            cursor: pointer;

            & img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            &.is-current {
                box-shadow: 0 0 0 2px var(--f-color-bg-1), 0 0 0 4px var(--f-color-brand);
            }

            &:focus-visible {
                outline-offset: 4px; /* outside the current one's ring */
            }
        }

        & .button {
            margin: 0;
        }
    }

    /* Color pickers in the page controls and the index settings. */
    :is(.demo-controls, .demo-index-settings) {
        /* The native picker drawn as a round swatch. */
        & input[type="color"] {
            flex: none;
            width: 2rem;
            height: 2rem;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: none;
            box-shadow: inset 0 0 0 1px var(--f-color-border-1);
            cursor: pointer;

            &::-webkit-color-swatch-wrapper {
                padding: 0;
            }

            /* Separate rules: a list with an unknown pseudo-element is dropped as a whole. */
            &::-webkit-color-swatch {
                border: 0;
                border-radius: 50%;
            }

            &::-moz-color-swatch {
                border: 0;
                border-radius: 50%;
            }
        }

        & .demo-hex {
            color: var(--f-color-text-1);
            font-family: monospace;
            font-size: 0.8125rem;
        }

        & :disabled + .demo-hex,
        & input:disabled {
            opacity: 0.35;
            cursor: default;
        }
    }

    .demo-swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 8.5rem), 1fr));
        gap: 0.5rem;
    }

    /* The three backgrounds nested as they are used. */
    .demo-layers {
        padding: 1rem;
        border-radius: var(--f-radius);
        background: var(--f-color-bg-0);
        box-shadow: inset 0 0 0 1px var(--f-color-border-0);
        font-size: 0.8125rem;

        & div {
            margin-top: 0.75rem;
            padding: 1rem;
            border-radius: var(--f-radius-small);
            background: var(--f-color-bg-1);
            box-shadow: inherit;

            & div {
                background: var(--f-color-bg-2);
            }
        }

        & small {
            margin-left: 0.5em;
            color: var(--f-color-text-2);
        }
    }

    /* A chip of the color, its name and its role below. */
    .demo-swatch {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8125rem;

        &::before {
            content: "";
            height: 3.5rem;
            border-radius: var(--f-radius-small);
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px var(--f-color-border-0);
        }

        & code {
            align-self: flex-start;
        }

        & small {
            color: var(--f-color-text-2);
        }
    }

    /* A section rendered from docs/<id>.md; a long reference starts folded. */
    .demo-doc {
        /* Links in the prose; .brand-links would also reach the examples' bare links. */
        & .card-section > :is(p, ul, ol) a,
        & td a {
            color: var(--f-color-brand);
        }

        & > summary {
            cursor: pointer;

            & h2 {
                display: inline;
                margin: 0;
            }
        }

        /* Color swatch, added by build-html.js to color values in code. */
        & code.has-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
        }

        & .swatch {
            width: 0.9em;
            height: 0.9em;
            border-radius: 3px;
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px rgb(0 0 0 / 15%);
        }
    }
</style>

<script>
    // A copy button on each example's code, added once it is opened.
    document.addEventListener('toggle', (e) => {
        const markup = e.target;
        if (!markup.matches?.('.demo-markup') || !markup.open || markup.querySelector('.demo-copy')) return;
        const button = Object.assign(document.createElement('button'), {
            type: 'button',
            className: 'button tiny secondary demo-copy',
            textContent: 'Copy',
        });
        button.addEventListener('click', async () => {
            await navigator.clipboard.writeText(markup.querySelector('code').textContent);
            button.textContent = 'Copied';
            setTimeout(() => (button.textContent = 'Copy'), 1500);
        });
        markup.append(button);
    }, true);

    // Placeholder links (href="#") would jump to the top. Other handlers still run.
    document.addEventListener('click', (e) => {
        if (e.target.closest('a[href="#"]')) e.preventDefault();
    });

    // Space theming on or off, light, dark or the device's mode and reduced motion (index), kept per browser.
    document.addEventListener('DOMContentLoaded', () => {
        const root = document.documentElement;
        document.getElementById('themingSwitch').addEventListener('change', (e) => {
            root.toggleAttribute('themed', e.target.checked);
            document.getElementById('theme-color').disabled = !e.target.checked;
        });

        const radios = document.querySelectorAll('[data-color-mode] input');
        const apply = (mode) => {
            if (mode === 'light' || mode === 'dark') root.dataset.theme = mode;
            else delete root.dataset.theme;
            radios.forEach((radio) => (radio.checked = radio.value === mode));
        };
        let saved = 'auto';
        try { saved = localStorage.getItem('theme-preference') || saved; } catch {}
        apply(saved);
        radios.forEach((radio) => {
            radio.addEventListener('change', () => {
                apply(radio.value);
                try { localStorage.setItem('theme-preference', radio.value); } catch {}
            });
        });

        // Reduced motion: the device's choice until the switch is used, then "reduce" or "full" (data-motion, _motion.scss).
        const toggle = document.querySelector('[data-reduce-motion]');
        const device = matchMedia('(prefers-reduced-motion: reduce)');
        const applyMotion = (motion) => {
            if (motion) root.dataset.motion = motion;
            toggle.checked = motion ? motion === 'reduce' : device.matches;
        };
        let motion = null;
        try { motion = localStorage.getItem('motion-preference'); } catch {}
        applyMotion(motion);
        device.addEventListener('change', () => applyMotion(root.dataset.motion));
        toggle.addEventListener('change', () => {
            const value = toggle.checked ? 'reduce' : 'full';
            applyMotion(value);
            try { localStorage.setItem('motion-preference', value); } catch {}
        });
    });

    // Open the reference doc a link points to, and mark the first part in view in the index.
    document.addEventListener('DOMContentLoaded', () => {
        const openTarget = () => {
            const doc = document.querySelector(`${location.hash || 'x'} > details:not([open])`);
            if (!doc) return;
            doc.open = true;
            doc.scrollIntoView();
        };
        window.addEventListener('hashchange', openTarget);
        openTarget();

        const links = new Map(
            [...document.querySelectorAll('.demo-index a')].map((a) => [a.hash.slice(1), a])
        );
        const visible = new Set();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e) => visible[e.isIntersecting ? 'add' : 'delete'](e.target.id));
            const current = [...links.keys()].find((id) => visible.has(id));
            if (!current) return;
            links.forEach((a) => a.removeAttribute('aria-current'));
            links.get(current).setAttribute('aria-current', 'true');
        }, { rootMargin: '-20% 0px -70% 0px' });
        links.forEach((_a, id) => {
            const target = document.getElementById(id);
            if (target) observer.observe(target);
        });
    });
    // Header image, theme and brand color for the whole page. A Space's theme color comes from its
    // header image, as in Spaces; the picker overrides it until the next image.
    document.addEventListener('DOMContentLoaded', () => {
        const root = document.documentElement;
        const image = document.getElementById('header-image');
        const theme = document.getElementById('theme-color');
        const brand = document.getElementById('brand-color');
        const brandReset = document.getElementById('brand-color-reset');
        const thumbs = document.querySelectorAll('#header-image-choice .demo-thumb');

        const showHex = (input) => (input.nextElementSibling.value = input.value);
        const setTheme = (hex) => {
            theme.value = hex.toLowerCase();
            showHex(theme);
            root.style.setProperty('--f-color-theme', theme.value);
        };

        thumbs.forEach((thumb) => {
            thumb.addEventListener('click', () => {
                thumbs.forEach((t) => {
                    t.classList.toggle('is-current', t === thumb);
                    t.setAttribute('aria-pressed', t === thumb);
                });
                image.src = thumb.querySelector('img').src;
                setTheme(thumb.dataset.color);
            });
        });

        theme.addEventListener('input', () => setTheme(theme.value));

        brand.addEventListener('input', () => {
            root.style.setProperty('--f-color-brand-base', brand.value);
            root.style.setProperty('--f-color-brand-base-contrast', contrastOn(brand.value));
            brandReset.hidden = false;
            showHex(brand);
            paintFavicon();
        });
        brandReset.addEventListener('click', () => {
            root.style.removeProperty('--f-color-brand-base');
            root.style.removeProperty('--f-color-brand-base-contrast');
            brand.value = brand.defaultValue;
            brandReset.hidden = true;
            showHex(brand);
            paintFavicon();
        });

        // The brand color can differ per color mode.
        document.querySelectorAll('[data-color-mode] input').forEach((radio) => radio.addEventListener('change', paintFavicon));
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintFavicon);
        paintFavicon();
    });

    /**
     * Draws the favicon as an SVG in the current brand color (assets/favicon.ico stays the fallback without JS).
     *
     * @return {void}
     */
    function paintFavicon() {
        const probe = document.body.appendChild(document.createElement('i'));
        probe.style.cssText = 'color: var(--f-color-brand); background-color: var(--f-color-brand-contrast)';
        const { color, backgroundColor } = getComputedStyle(probe);
        probe.remove();
        // The cube from the Spaces logo.
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 151"><path d="M137,98.93V29.08a16.05,16.05,0,0,0-13.39-15.83L56,1.92A26,26,0,0,0,33.29,9.17L8.6,33.87A26,26,0,0,0,1,52.25V122.1a16,16,0,0,0,13.39,15.82L82,149.26A26,26,0,0,0,104.65,142l24.7-24.69A26,26,0,0,0,137,98.93Z" fill="${color}"/><text x="69" y="110" fill="${backgroundColor}" font-family="system-ui, sans-serif" font-size="96" font-weight="800" text-anchor="middle">S</text></svg>`;
        const icon = document.querySelector('link[rel~="icon"]');
        icon.type = 'image/svg+xml';
        icon.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    /**
     * @param {string} hex A background color.
     * @return {string} Black or white, whichever contrasts more (WCAG luminance).
     */
    function contrastOn(hex) {
        const [r, g, b] = [1, 3, 5].map((i) => {
            const c = parseInt(hex.slice(i, i + 2), 16) / 255;
            return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return luminance > 0.179 ? 'black' : 'white';
    }
</script>
