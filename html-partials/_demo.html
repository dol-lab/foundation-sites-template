<!-- Styles and scripts of this page only, prefixed demo- (ds- is defaultspace's); nothing here ships in css/ or js/. Nothing page-only goes into scss/: the page uses library classes, so a missing style is a gap in the library. -->
<style>
    /* Breakpoints of this library: medium 30em, large 45em, xlarge 60em, xxlarge 75em. */
    html {
        scroll-behavior: smooth;
        scroll-padding-top: 1rem;
    }

    .demo-section {
        & > .card > .card-section {
            padding: 1.25rem;

            @media (min-width: 30em) {
                padding: 2rem;
            }
        }

        & h2 {
            margin-bottom: 0.25rem;
        }

        /* The section's own headings, not those of an example. */
        & .card-section > :is(h3, h4) {
            margin-top: 1.5rem;
        }
    }

    .demo-intro {
        color: var(--f-color-text-2);
        max-width: 42rem;
    }

    /* Inline code is a name: it moves to the next line whole. One longer than the line breaks between its words (build-html.js wraps each in a .demo-word); a name in a table never breaks. */
    :not(pre) > code {
        display: inline-block;
        max-width: 100%;
    }

    td > code,
    .demo-word {
        white-space: nowrap;
    }

    td > code:has(> .demo-word) {
        white-space: normal;
    }

    /* Syntax highlighting: build-html.js marks the tokens up with highlight.js. Fixed hues at a lightness that holds AA on bg-2 in both modes. */
    .code-block {
        --demo-hl-tag: light-dark(oklch(0.48 0.13 250), oklch(0.8 0.1 250));
        --demo-hl-attr: light-dark(oklch(0.48 0.13 300), oklch(0.8 0.1 300));
        --demo-hl-string: light-dark(oklch(0.48 0.12 150), oklch(0.8 0.12 150));
        --demo-hl-value: light-dark(oklch(0.5 0.13 50), oklch(0.8 0.1 50));

        & :is(.hljs-tag, .hljs-name, .hljs-keyword, .hljs-selector-tag) {
            color: var(--demo-hl-tag);
        }

        & :is(.hljs-attr, .hljs-attribute, .hljs-selector-class, .hljs-selector-id, .hljs-variable, .hljs-title) {
            color: var(--demo-hl-attr);
        }

        & :is(.hljs-string, .hljs-regexp) {
            color: var(--demo-hl-string);
        }

        & :is(.hljs-number, .hljs-literal, .hljs-built_in, .hljs-meta) {
            color: var(--demo-hl-value);
        }

        & .hljs-comment {
            color: var(--f-color-text-2);
            font-style: italic;
        }
    }

    @media (max-width: 44.9375em) {
        .demo-doc :is(p, li, .demo-table td) > code {
            white-space: normal;
            overflow-wrap: anywhere;
        }
    }

    /* Small uppercase label: the index's groups. */
    .demo-label {
        margin: 0;
        color: var(--f-color-text-0);
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    /* Table of contents: stacked above the content below large, folded there (data-collapse) with
       its groups side by side; from large a sticky rail whose active link follows the scroll. */
    .demo-index {
        & summary {
            font-weight: 500;
            cursor: pointer;
        }

        & .demo-index-groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
            gap: 1.25rem 1rem;
            margin-top: 0.75rem;
        }

        & h2 {
            margin-bottom: 0.375rem;
            /* In line with the links' text: their padding plus the current-item border. */
            padding-left: calc(0.75rem + 2px);
        }

        /* Demo settings, reachable wherever the page is scrolled. */
        & .demo-index-settings {
            border-top: 1px solid var(--f-color-border-0);

            & fieldset {
                margin: 0;
            }
        }

        /* A label column, then the swatch and its hex in columns of their own, so rows line up. */
        & .demo-index-rows {
            display: grid;
            grid-template-columns: 1fr auto 7ch;
            align-items: center;
            gap: 0.75rem 0.5rem;
            padding-top: 1rem;

            & > .label-wrapper {
                grid-column: 1;
                margin: 0;
            }

            & > .label-wrapper:last-child {
                grid-column: 1 / -1;
            }
        }

        /* In line with the switches' labels: a tiny switch (1.25rem) and .label-wrapper's gap after it. */
        & .demo-index-brand {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding-left: 1.75rem;

            & label {
                margin: 0;
            }

            & .button {
                margin: 0;
            }
        }

        & .menu {
            box-shadow: inset 1px 0 var(--f-color-border-0);

            & a {
                padding: 0.3rem 0.75rem;
                border-left: 2px solid transparent;
                border-radius: 0 var(--f-radius-small) var(--f-radius-small) 0;
                color: var(--f-color-text-1);

                &:hover {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-border-2);
                }

                &[aria-current] {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-brand);
                    background: var(--f-color-bg-2);
                }
            }
        }

        /* The header scrolls away, so the index sticks at the grid's own gutter. */
        @media (min-width: 45em) {
            position: sticky;
            top: 1rem;
            align-self: flex-start;

            /* The list scrolls, the color mode below it stays in view. */
            & .card {
                max-height: calc(100vh - 2rem);
            }

            & details {
                --f-focus-offset: var(--f-focus-inset);

                flex: 0 1 auto;
                min-height: 0;
                overflow-y: auto;
            }

            /* No summary to reopen it here, so the list shows even if it was closed on a phone. */
            & summary {
                display: none;
            }

            & details::details-content {
                content-visibility: visible;
            }

            & .demo-index-groups {
                grid-template-columns: 1fr;
                margin-top: 0;
            }
        }
    }

    /* An example on a dotted stage, its code folded under it in the same frame. */
    .demo-example {
        margin: 1rem 0 1.5rem;
        border: 1px solid var(--f-color-border-1);
        border-radius: var(--f-radius);
        overflow: clip;
        overflow-clip-margin: calc(var(--f-focus-offset) + var(--f-focus-width)); /* the focus ring of a full-width child */

        /* That margin lets a child's background over the rounded border, so the outer children round too. */
        & > :first-child {
            border-start-start-radius: calc(var(--f-radius) - 1px);
            border-start-end-radius: calc(var(--f-radius) - 1px);
        }

        & > :last-child {
            border-end-start-radius: calc(var(--f-radius) - 1px);
            border-end-end-radius: calc(var(--f-radius) - 1px);
        }
    }

    .demo-preview {
        position: relative;
        padding: 1.5rem 1.25rem;
        background: radial-gradient(color-mix(in oklch, var(--f-color-border-0) 60%, transparent) 1px, transparent 1px) 0 0 / 1rem 1rem, light-dark(var(--f-color-bg-2), color-mix(in oklch, var(--f-color-bg-1), var(--f-color-bg-0)));

        & > :last-child {
            margin-bottom: 0;
        }
    }

    /* Lays out a row of inline components without their own margins. */
    .demo-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.5rem;
        margin-bottom: 0.5rem;

        & > * {
            margin: 0;
        }
    }

    .demo-markup {
        position: relative;
        border-top: 1px solid var(--f-color-border-0);
        background: var(--f-color-bg-0);

        & > summary {
            display: flex;
            gap: 0.5em;
            align-items: center;
            justify-content: flex-end;
            padding: 0.25rem 0.75rem;
            color: var(--f-color-text-2);
            font-size: 0.75rem;
            cursor: pointer;
            list-style: none;

            &::-webkit-details-marker {
                display: none;
            }

            &::before {
                content: "</>";
                font-family: monospace;
            }

            &:hover {
                color: var(--f-color-text-0);
            }
        }

        &[open] > summary {
            border-bottom: 1px solid var(--f-color-border-0);
        }

        & .code-block {
            max-height: 24rem;
            margin: 0;
            padding: 1rem 1.25rem;
            border: 0;
            border-radius: 0;
            background: transparent;
            font-size: 0.8125rem;
        }

        & code[contenteditable] {
            display: block;
            cursor: text;

            /* Focus shows as a field's border does, for mouse and keyboard alike: a ring would frame every click. */
            &:focus-visible {
                outline: none;
            }
        }

        & .code-block:has(> code:focus) {
            box-shadow: inset 0 0 0 1px var(--f-color-text-2);
        }

        & .demo-copy {
            position: absolute;
            right: 0.75rem;
            bottom: 0.75rem;
            margin: 0;
        }
    }

    /* The global inline-code pill would frame every line of a code block. */
    .code-block > code {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 1em;
    }

    /* The header image's switch, frosted like the title over it. */
    .demo-header-image {
        position: absolute;
        z-index: 1;
        right: 0.75rem;
        bottom: 0.75rem;
        display: grid;
        place-items: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        color: var(--f-color-text-0);
        background: color-mix(in oklab, var(--f-color-bg-0) 55%, transparent);
        backdrop-filter: blur(20px) saturate(200%);
        cursor: pointer;

        &:hover {
            background: color-mix(in oklab, var(--f-color-bg-0) 80%, transparent);
        }
    }

    /* Color pickers in the index settings. */
    .demo-index-settings {
        /* The native picker drawn as a round swatch. */
        & input[type="color"] {
            flex: none;
            width: 2rem;
            height: 2rem;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: none;
            box-shadow: inset 0 0 0 1px var(--f-color-border-1);
            cursor: pointer;

            &::-webkit-color-swatch-wrapper {
                padding: 0;
            }

            /* Separate rules: a list with an unknown pseudo-element is dropped as a whole. */
            &::-webkit-color-swatch {
                border: 0;
                border-radius: 50%;
            }

            &::-moz-color-swatch {
                border: 0;
                border-radius: 50%;
            }
        }

        & .demo-hex {
            color: var(--f-color-text-1);
            font-family: monospace;
            font-size: 0.8125rem;
        }

        & :disabled + .demo-hex,
        & input:disabled {
            opacity: 0.35;
            cursor: default;
        }
    }

    .demo-swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 8.5rem), 1fr));
        gap: 0.5rem;
    }

    /* Tinted copies of .demo-layers side by side. */
    .demo-tints {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    /* The three backgrounds nested as they are used. */
    .demo-layers {
        padding: 1rem;
        border-radius: var(--f-radius);
        background: var(--f-color-bg-0);
        box-shadow: inset 0 0 0 1px var(--f-color-border-0);
        color: var(--f-color-text-1);
        font-size: 0.8125rem;

        & div {
            margin-top: 0.75rem;
            padding: 1rem;
            border-radius: var(--f-radius-small);
            background: var(--f-color-bg-1);
            box-shadow: inherit;

            & div {
                background: var(--f-color-bg-2);
            }
        }

        & small {
            margin-left: 0.5em;
            color: var(--f-color-text-2);
        }
    }

    /* A chip of the color, its name and its role below. */
    .demo-swatch {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8125rem;

        &::before {
            content: "";
            height: 3.5rem;
            border-radius: var(--f-radius-small);
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px var(--f-color-border-0);
        }

        & code {
            align-self: flex-start;
        }

        & small {
            color: var(--f-color-text-2);
        }
    }

    /* A section rendered from docs/<id>.md. */
    .demo-doc {
        /* Links in the prose; .brand-links would also reach the examples' bare links. */
        & .card-section > :is(p, ul, ol) a,
        & td a {
            color: var(--f-color-brand);
        }

        /* Color swatch, added by build-html.js to color values in code. */
        & code.has-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
        }

        & .swatch {
            width: 0.9em;
            height: 0.9em;
            border-radius: 3px;
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px rgb(0 0 0 / 15%);
        }
    }

    /* A phone stacks a docs table: one block per row, each later cell under its column's label. */
    @media (max-width: 44.9375em) {
        .demo-table {
            & thead {
                display: none;
            }

            & :is(tbody, tr, td) {
                display: block;
            }

            & tr {
                padding: 0.4rem 0;
                border-bottom: 1px solid var(--f-color-border-0);
            }

            & td {
                padding: 0.1rem 0;
                border: 0;
            }

            & td:not(:first-child)::before {
                content: attr(data-label);
                display: block;
                color: var(--f-color-text-2);
                font-size: 0.8rem;
            }
        }
    }
</style>

<script>
    // A copy button on each example's code, added once it is opened.
    document.addEventListener('toggle', (e) => {
        const markup = e.target;
        if (!markup.matches?.('.demo-markup') || !markup.open || markup.querySelector('.demo-copy')) return;
        const button = Object.assign(document.createElement('button'), {
            type: 'button',
            className: 'button tiny secondary demo-copy',
            textContent: 'Copy',
        });
        button.addEventListener('click', async () => {
            await navigator.clipboard.writeText(markup.querySelector('code').textContent);
            button.textContent = 'Copied';
            setTimeout(() => (button.textContent = 'Copy'), 1500);
        });
        markup.append(button);
        markup.querySelector('code').setAttribute('contenteditable', 'plaintext-only');
        markup.querySelector('code').spellcheck = false;
    }, true);

    // Editing an example's code re-renders its preview; leaving the code highlights it again. Highlighting is
    // only color: without highlight.js (loaded from the CDN on the first edit) the code stays plain.
    let rerender;
    document.addEventListener('input', (e) => {
        const code = e.target.closest?.('.demo-markup code');
        if (!code) return;
        clearTimeout(rerender);
        rerender = setTimeout(() => {
            const preview = code.closest('.demo-example').querySelector('.demo-preview');
            (preview.querySelector(':scope > .demo-row') ?? preview).innerHTML = code.textContent;
        }, 300);
        loadHighlighter().catch(() => {});
    });
    document.addEventListener('focusout', async (e) => {
        const code = e.target.closest?.('.demo-markup code');
        const hljs = code && (await loadHighlighter().catch(() => null));
        if (hljs) code.innerHTML = hljs.highlight(code.textContent, { language: 'html' }).value;
    });

    /**
     * Loads highlight.js once.
     *
     * @return {Promise<object>} The hljs global.
     */
    function loadHighlighter() {
        loadHighlighter.promise ??= new Promise((resolve, reject) => {
            document.head.append(Object.assign(document.createElement('script'), {
                src: 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js',
                onload: () => resolve(window.hljs),
                onerror: reject,
            }));
        });
        return loadHighlighter.promise;
    }

    // Placeholder links (href="#") would jump to the top. Other handlers still run.
    document.addEventListener('click', (e) => {
        if (e.target.closest('a[href="#"]')) e.preventDefault();
    });

    // Space theming on or off, light, dark or the device's mode and reduced motion (index), kept per browser.
    document.addEventListener('DOMContentLoaded', () => {
        const root = document.documentElement;
        document.getElementById('themingSwitch').addEventListener('change', (e) => {
            root.toggleAttribute('themed', e.target.checked);
            document.getElementById('theme-color').disabled = !e.target.checked;
        });

        const radios = document.querySelectorAll('[data-color-mode] input');
        const apply = (mode) => {
            if (mode === 'light' || mode === 'dark') root.dataset.theme = mode;
            else delete root.dataset.theme;
            radios.forEach((radio) => (radio.checked = radio.value === mode));
        };
        let saved = 'auto';
        try { saved = localStorage.getItem('theme-preference') || saved; } catch {}
        apply(saved);
        radios.forEach((radio) => {
            radio.addEventListener('change', () => {
                apply(radio.value);
                try { localStorage.setItem('theme-preference', radio.value); } catch {}
            });
        });

        // Reduced motion: the device's choice until the switch is used, then "reduce" or "full" (data-motion, _motion.scss).
        const toggle = document.querySelector('[data-reduce-motion]');
        const device = matchMedia('(prefers-reduced-motion: reduce)');
        const applyMotion = (motion) => {
            if (motion) root.dataset.motion = motion;
            toggle.checked = motion ? motion === 'reduce' : device.matches;
        };
        let motion = null;
        try { motion = localStorage.getItem('motion-preference'); } catch {}
        applyMotion(motion);
        device.addEventListener('change', () => applyMotion(root.dataset.motion));
        toggle.addEventListener('change', () => {
            const value = toggle.checked ? 'reduce' : 'full';
            applyMotion(value);
            try { localStorage.setItem('motion-preference', value); } catch {}
        });
    });

    // Mark the first part in view in the index.
    document.addEventListener('DOMContentLoaded', () => {
        const links = new Map(
            [...document.querySelectorAll('.demo-index a')].map((a) => [a.hash.slice(1), a])
        );
        const visible = new Set();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e) => visible[e.isIntersecting ? 'add' : 'delete'](e.target.id));
            const current = [...links.keys()].find((id) => visible.has(id));
            if (!current) return;
            links.forEach((a) => a.removeAttribute('aria-current'));
            links.get(current).setAttribute('aria-current', 'true');
        }, { rootMargin: '-20% 0px -70% 0px' });
        links.forEach((_a, id) => {
            const target = document.getElementById(id);
            if (target) observer.observe(target);
        });
    });
    // Header image, theme and brand color for the whole page. A Space's theme color comes from its
    // header image, as in Spaces; the picker overrides it until the next image.
    document.addEventListener('DOMContentLoaded', () => {
        const root = document.documentElement;
        const image = document.getElementById('header-image');
        const theme = document.getElementById('theme-color');
        const brand = document.getElementById('brand-color');
        const brandReset = document.getElementById('brand-color-reset');
        const next = document.getElementById('header-image-next');
        const images = [
            ['assets/img/img-header--1.png', '#975938'],
            ['assets/img/chris-lutke-RJ0AtWtDlKM-unsplash.jpg', '#a3c3f3'],
            ['assets/img/img-header--2.png', '#a63017'],
            ['assets/img/img-header--4.png', '#4a9a6d'],
        ];
        let current = 0;

        const showHex = (input) => (input.nextElementSibling.value = input.value);
        const setTheme = (hex) => {
            theme.value = hex.toLowerCase();
            showHex(theme);
            root.style.setProperty('--f-color-theme', theme.value);
        };

        next.addEventListener('click', () => {
            current = (current + 1) % images.length;
            image.src = images[current][0];
            setTheme(images[current][1]);
        });

        theme.addEventListener('input', () => setTheme(theme.value));

        brand.addEventListener('input', () => {
            root.style.setProperty('--f-color-brand-base', brand.value);
            root.style.setProperty('--f-color-brand-base-contrast', contrastOn(brand.value));
            brandReset.hidden = false;
            showHex(brand);
            paintFavicon();
        });
        brandReset.addEventListener('click', () => {
            root.style.removeProperty('--f-color-brand-base');
            root.style.removeProperty('--f-color-brand-base-contrast');
            brand.value = brand.defaultValue;
            brandReset.hidden = true;
            showHex(brand);
            paintFavicon();
        });

        // The brand color can differ per color mode.
        document.querySelectorAll('[data-color-mode] input').forEach((radio) => radio.addEventListener('change', paintFavicon));
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintFavicon);
        paintFavicon();
    });

    /**
     * Draws the favicon as an SVG in the current brand color (assets/favicon.ico stays the fallback without JS).
     *
     * @return {void}
     */
    function paintFavicon() {
        const probe = document.body.appendChild(document.createElement('i'));
        probe.style.cssText = 'color: var(--f-color-brand); background-color: var(--f-color-brand-contrast)';
        const { color, backgroundColor } = getComputedStyle(probe);
        probe.remove();
        // The tab bar follows the system's color scheme, not the page's. A brand below 3:1 against it gets a rim.
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = color;
        ctx.fillRect(0, 0, 1, 1);
        const brand = luminance([...ctx.getImageData(0, 0, 1, 1).data.slice(0, 3)]);
        const bar = dark ? 0.016 : 0.75; // Chrome's and Firefox's tab bars, about #202124 and #dee1e6
        const rim = (Math.max(brand, bar) + 0.05) / (Math.min(brand, bar) + 0.05) < 3 ? (dark ? 'white' : 'black') : 'none';
        // The cube from the Spaces logo.
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 154 167"><path d="M137,98.93V29.08a16.05,16.05,0,0,0-13.39-15.83L56,1.92A26,26,0,0,0,33.29,9.17L8.6,33.87A26,26,0,0,0,1,52.25V122.1a16,16,0,0,0,13.39,15.82L82,149.26A26,26,0,0,0,104.65,142l24.7-24.69A26,26,0,0,0,137,98.93Z" fill="${color}" stroke="${rim}" stroke-width="16" paint-order="stroke"/><text x="69" y="110" fill="${backgroundColor}" font-family="system-ui, sans-serif" font-size="96" font-weight="800" text-anchor="middle">S</text></svg>`;
        const icon = document.querySelector('link[rel~="icon"]');
        icon.type = 'image/svg+xml';
        icon.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    /**
     * @param {string} hex A background color.
     * @return {string} Black or white, whichever contrasts more (WCAG luminance).
     */
    function contrastOn(hex) {
        return luminance([1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))) > 0.179 ? 'black' : 'white';
    }

    /**
     * @param {number[]} rgb Red, green and blue, 0 to 255.
     * @return {number} The WCAG relative luminance.
     */
    function luminance(rgb) {
        const [r, g, b] = rgb.map((v) => {
            const c = v / 255;
            return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
</script>
