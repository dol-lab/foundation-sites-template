<!-- Styles and scripts of this page only; nothing here ships in css/ or js/. -->
<style>
    /* Breakpoints of this library: medium 30em, large 45em, xlarge 60em, xxlarge 75em. */
    html {
        scroll-behavior: smooth;
        scroll-padding-top: 1rem;
    }

    .demo-section {
        & > .card > .card-section {
            padding: 1.25rem;

            @media (min-width: 30em) {
                padding: 2rem;
            }
        }

        & h2 {
            margin-bottom: 0.25rem;
        }

        & h3 {
            margin-top: 1.5rem;
        }
    }

    .demo-intro {
        color: var(--f-color-text-2);
        max-width: 42rem;
    }

    .demo-section-head {
        padding: 0 0.25rem 0.5rem;
    }

    /* Inline code is a name: keep it on one line, unless a long path in the docs' prose would overflow a phone. */
    :not(pre) > code {
        white-space: nowrap;
    }

    @media (max-width: 44.9375em) {
        .demo-doc :is(p, li) > code {
            white-space: normal;
            overflow-wrap: anywhere;
        }
    }

    /* Table of contents: stacked above the content below large, folded there (data-collapse) with
       its groups side by side; from large a sticky rail whose active link follows the scroll. */
    .demo-index {
        & summary {
            font-weight: 500;
            cursor: pointer;
        }

        & .demo-index-groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
            gap: 1.25rem 1rem;
            margin-top: 0.75rem;
        }

        & h2 {
            margin: 0 0 0.375rem;
            /* In line with the links' text: their padding plus the current-item border. */
            padding-left: calc(0.75rem + 2px);
            color: var(--f-color-text-0);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        & .menu {
            box-shadow: inset 1px 0 var(--f-color-border-0);

            & a {
                padding: 0.3rem 0.75rem;
                border-left: 2px solid transparent;
                border-radius: 0 var(--f-radius-small) var(--f-radius-small) 0;
                color: var(--f-color-text-1);

                &:hover {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-border-2);
                }

                &[aria-current] {
                    color: var(--f-color-text-0);
                    border-left-color: var(--f-color-brand);
                    background: var(--f-color-bg-2);
                }
            }
        }

        /* The header scrolls away, so the index sticks at the grid's own gutter. */
        @media (min-width: 45em) {
            position: sticky;
            top: 1rem;
            align-self: flex-start;

            & .card {
                max-height: calc(100vh - 2rem);
                overflow-y: auto;
            }

            /* No summary to reopen it here, so the list shows even if it was closed on a phone. */
            & summary {
                display: none;
            }

            & details::details-content {
                content-visibility: visible;
            }

            & .demo-index-groups {
                grid-template-columns: 1fr;
                margin-top: 0;
            }
        }
    }

    /* An example in a frame, its markup as the frame's footer. */
    .demo-example {
        margin-top: 1rem;
        padding: 1.25rem;
        border: 1px solid var(--f-color-border-0);
        border-radius: var(--f-radius) var(--f-radius) 0 0;

        & > :last-child {
            margin-bottom: 0;
        }
    }

    /* Lays out a row of inline components without their own margins. */
    .demo-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.5rem;
        margin-bottom: 0.5rem;

        & > * {
            margin: 0;
        }
    }

    .demo-markup {
        margin-bottom: 1.5rem;
        border: 1px solid var(--f-color-border-0);
        border-top: 0;
        border-radius: 0 0 var(--f-radius) var(--f-radius);
        background: var(--f-color-bg-0);

        & > summary {
            display: flex;
            gap: 0.5em;
            align-items: center;
            padding: 0.375rem 1.25rem;
            color: var(--f-color-text-2);
            font-size: 0.8125rem;
            cursor: pointer;
            list-style: none;

            &::-webkit-details-marker {
                display: none;
            }

            &::before {
                content: "</>";
                font-family: monospace;
            }

            &:hover {
                color: var(--f-color-text-0);
            }
        }

        &[open] > summary {
            border-bottom: 1px solid var(--f-color-border-0);
        }

        & .code-block {
            max-height: 24rem;
            margin: 0;
            padding: 1rem 1.25rem;
            border: 0;
            border-radius: 0 0 var(--f-radius) var(--f-radius);
            background: transparent;
            font-size: 0.8125rem;
        }
    }

    /* The global inline-code pill would frame every line of a code block. */
    .code-block > code {
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 1em;
    }

    /* Header image, theme and brand color: page controls in #start. */
    .demo-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.5rem;
        color: var(--f-color-text-1);
        font-size: 0.875rem;

        & .demo-control {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.375rem;
        }

        & label {
            margin: 0;
            color: inherit;
            font-size: inherit;
        }

        & .demo-thumb {
            display: inline-grid;
            place-items: center;
            width: 2.75rem;
            height: 1.75rem;
            margin: 0;
            padding: 0;
            overflow: hidden;
            border-radius: var(--f-radius-small);
            background: var(--f-color-bg-1);
            box-shadow: inset 0 0 0 1px var(--f-color-border-1);
            color: var(--f-color-text-2);
            cursor: pointer;

            & img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            &.is-current {
                box-shadow: 0 0 0 2px var(--f-color-bg-0), 0 0 0 4px var(--f-color-text-0);
            }

            &:focus-visible {
                outline: 2px solid var(--f-color-brand);
                outline-offset: 4px;
            }
        }

        & input[type="color"] {
            width: 2.75rem;
            height: 1.75rem;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: var(--f-radius-small);
            background: none;
            cursor: pointer;
        }
    }

    .demo-swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 8.5rem), 1fr));
        gap: 0.5rem;
    }

    /* A chip of the color, its name and its role below. */
    .demo-swatch {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8125rem;

        &::before {
            content: "";
            height: 3.5rem;
            border-radius: var(--f-radius-small);
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px var(--f-color-border-0);
        }

        & code {
            align-self: flex-start;
        }

        & small {
            color: var(--f-color-text-2);
        }
    }

    /* Rendered markdown (HELPER_CLASSES.md, VARIABLES.md, DARK_THEME.md). */
    .demo-doc {
        & > summary {
            cursor: pointer;

            & h2 {
                display: inline;
                margin: 0;
            }
        }

        & .user-generated > h1:first-child {
            display: none;
        }

        & .user-generated > * + :is(h2, h3, h4) {
            margin-top: 1.25em;
        }

        & .table-scroll {
            overflow-x: auto;
        }

        & table {
            width: 100%;
            border-collapse: collapse;
        }

        & th,
        & td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid var(--f-color-border-0);
            text-align: left;
            vertical-align: top;
        }

        & .docs-source {
            color: var(--f-color-text-2);
            text-align: right;
        }

        /* Color swatch, added by build-html.js to color values in code. */
        & code.has-swatch {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
        }

        & .swatch {
            width: 0.9em;
            height: 0.9em;
            border-radius: 3px;
            background: var(--swatch);
            box-shadow: inset 0 0 0 1px rgb(0 0 0 / 15%);
        }
    }
</style>

<script>
    // Placeholder links (href="#") would jump to the top. Foundation's own handlers still run.
    document.addEventListener('click', (e) => {
        if (e.target.closest('a[href="#"]')) e.preventDefault();
    });

    // Header controls: Space theming on or off, and light, dark or the device's mode (kept per browser).
    document.addEventListener('DOMContentLoaded', () => {
        const root = document.documentElement;
        document.getElementById('themingSwitch').addEventListener('change', (e) => {
            root.toggleAttribute('themed', e.target.checked);
        });

        const apply = (mode) => {
            if (mode === 'light' || mode === 'dark') root.dataset.theme = mode;
            else delete root.dataset.theme;
        };
        let saved = 'auto';
        try { saved = localStorage.getItem('theme-preference') || saved; } catch {}
        apply(saved);
        document.querySelectorAll('#theme-choice input').forEach((radio) => {
            radio.checked = radio.value === saved;
            radio.addEventListener('change', () => {
                apply(radio.value);
                try { localStorage.setItem('theme-preference', radio.value); } catch {}
            });
        });
    });

    // Open the reference doc a link points to, and mark the first part in view in the index.
    document.addEventListener('DOMContentLoaded', () => {
        const openTarget = () => {
            const doc = document.querySelector(`${location.hash || 'x'} > details:not([open])`);
            if (!doc) return;
            doc.open = true;
            doc.scrollIntoView();
        };
        window.addEventListener('hashchange', openTarget);
        openTarget();

        const links = new Map(
            [...document.querySelectorAll('.demo-index a')].map((a) => [a.hash.slice(1), a])
        );
        const visible = new Set();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((e) => visible[e.isIntersecting ? 'add' : 'delete'](e.target.id));
            const current = [...links.keys()].find((id) => visible.has(id));
            if (!current) return;
            links.forEach((a) => a.removeAttribute('aria-current'));
            links.get(current).setAttribute('aria-current', 'true');
        }, { rootMargin: '-20% 0px -70% 0px' });
        links.forEach((_a, id) => {
            const target = document.getElementById(id);
            if (target) observer.observe(target);
        });
    });
</script>
